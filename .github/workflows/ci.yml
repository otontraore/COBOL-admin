name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/rbac-authors-post-labels

jobs:
  server:
    name: Server syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node -c index.js
      - run: node -e "JSON.parse(require('fs').readFileSync('openapi.json', 'utf8')); console.log('openapi.json is valid')"